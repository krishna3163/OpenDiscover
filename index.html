<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0f1a" />
  <meta name="color-scheme" content="dark" />

  <title>OpenDiscover — Find &amp; Trust Open Source Software</title>
  <meta name="description"
    content="OpenDiscover is a curated directory of open-source apps, AI models, privacy tools and dev tools. Every entry links to its official source, with a transparent Trust Score and plain-English license explanations." />
  <meta name="author" content="Krishna" />
  <link rel="canonical" href="https://krishna3163.github.io/OpenDiscover/" />

  <!-- Icons -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/banner.png" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="OpenDiscover" />
  <meta property="og:title" content="OpenDiscover — Find &amp; Trust Open Source Software" />
  <meta property="og:description"
    content="Curated open-source apps, AI models and privacy tools. Verified licenses, transparent Trust Scores, official sources only — we never host binaries." />
  <meta property="og:image" content="/banner.png" />
  <meta property="og:url" content="https://krishna3163.github.io/OpenDiscover/" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="OpenDiscover — Find &amp; Trust Open Source Software" />
  <meta name="twitter:description"
    content="Curated open-source apps, AI models and privacy tools with verified licenses and Trust Scores." />
  <meta name="twitter:image" content="/banner.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "OpenDiscover",
      "url": "https://krishna3163.github.io/OpenDiscover/",
      "description": "A curated directory for discovering and verifying open-source software, AI models and privacy tools.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://krishna3163.github.io/OpenDiscover/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
